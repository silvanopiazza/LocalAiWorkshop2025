name: Smoke tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Hugging Face model cache
        uses: actions/cache@v4
        with:
          # HF cache default is ~/.cache/huggingface; include both models and transformers-cache
          path: |
            ~/.cache/huggingface
            ~/.cache/huggingface/transformers
          key: ${{ runner.os }}-hf-models-${{ env.HF_CACHE_KEY || 'default' }}
          restore-keys: |
            ${{ runner.os }}-hf-models-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ${{ github.workspace }}

      - name: Run smoke test (skip generation)
        run: |
          python scripts/smoke_test.py --skip-generation
        working-directory: ${{ github.workspace }}
